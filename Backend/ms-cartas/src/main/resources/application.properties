spring.application.name=ms-yugi-oh

# Configuración de H2 Database
spring.datasource.url=jdbc:h2:mem:duelmonsters
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=yugi
spring.datasource.password=muto

# Configuración de Hibernate/JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# "update" creará las tablas basadas en tu modelo automáticamente
spring.jpa.hibernate.ddl-auto=update 
spring.jpa.show-sql=true

# Habilitar consola H2 (Acceso en http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Ejecutar el script data.sql al iniciar
spring.sql.init.mode=always